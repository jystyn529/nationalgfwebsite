<body class="home-page">
  <!-- Intro envelope -->
  <div class="intro-overlay" id="intro-overlay">
    <button type="button" class="envelope" id="envelope-btn" aria-label="Open envelope for Alicia Tanzil">

      <span class="envelope-body" aria-hidden="true"></span>

          <line class="stamen-line" x1="0" y1="0" x2="-8" y2="-8" stroke="#062892" stroke-width="1.2"/>

          <g class="petal-wrap" transform="rotate(255)"><ellipse class="petal" cx="0" cy="-26" rx="9" ry="26" fill="url(#lilyBluePetals)"/></g>

          <circle class="stamen" cx="0" cy="0" r="4" fill="#062892"/>
          <line class="stamen-line" x1="0" y1="0" x2="0" y2="-12" stroke="#062892" stroke-width="1.2"/>
          <line class="stamen-line" x1="0" y1="0" x2="8" y2="-8" stroke="#062892" stroke-width="1.2"/>
          <line class="stamen-line" x1="0" y1="0" x2="-8" y2="-8" stroke="#062892" stroke-width="1.2"/>
        </g>
      </svg>

    <div class="sonny-sprinkle" aria-hidden="true">

  <div class="music-player" id="music-player">
    <div class="player-controls">
      <button type="button" id="prev-btn" aria-label="Previous song">⏮</button>
      <button type="button" id="play-btn" aria-label="Play">▶</button>
      <button type="button" id="next-btn" aria-label="Next song">⏭</button>
    </div>
    <div class="player-track">
      <p class="player-title" id="song-title">—</p>
      <div class="player-progress-wrap">
        <span class="player-time" id="time-current">0:00</span>

        </div>

    <div class="player-volume-wrap">
      <button type="button" class="player-volume-toggle" aria-label="Volume">🔊</button>
      <div class="player-volume-popup" role="group" aria-label="Volume">
        <input type="range" id="volume-slider" min="0" max="100" value="80" aria-label="Volume">
